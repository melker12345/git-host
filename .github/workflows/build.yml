# Builds the Go CLI and the Android app on every push, and attaches both to
# a GitHub release when a tag like v0.2.0 is pushed. A new phone then needs
# only the APK from the release page: sideload, scan the QR code, sync.
#
# Release signing: add the keystore as repository secrets and release APKs
# are signed with it so updates install in place.
#   ANDROID_KEYSTORE_BASE64   base64 of ~/.config/git-host/release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         (githost)
#   ANDROID_KEY_PASSWORD
# Without them the workflow still builds and ships a debug-signed APK.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: git-host/go.mod
      - name: Test
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        working-directory: git-host
        run: go vet ./... && go test ./...
      - name: Build
        working-directory: git-host
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o ../dist/git-host-${{ matrix.goos }}-${{ matrix.goarch }} .
      - uses: actions/upload-artifact@v4
        with:
          name: git-host-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.6"
      - name: Restore signing keystore
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build
        working-directory: android
        run: gradle assembleRelease assembleDebug --no-daemon --console=plain
      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release*.apk dist/git-host.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/git-host2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
